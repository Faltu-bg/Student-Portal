<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile Settings</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fb;
}

.app-container {
    display: flex;
    height: 100vh;
    width: 100%;
}

/* SIDEBAR */
.sidebar {
    width: 240px;
    background: linear-gradient(135deg, #0d8bdc, #6a2c91);
    color: white;
    padding: 30px 20px;
}

.sidebar h3 {
    text-align: center;
    margin-bottom: 30px;
}

.sidebar ul {
    list-style: none;
    padding: 0;
}

.sidebar ul li {
    margin: 20px 0;
}

.sidebar ul li a {
    color: white;
    text-decoration: none;
}

/* MAIN */
.main {
    flex: 1;
    padding: 30px;
}

.profile-card {
    display: flex;
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

/* LEFT */
.profile-left {
    width: 25%;
    text-align: center;
    padding: 30px;
    border-right: 1px solid #eee;
}

.profile-left img {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    cursor: pointer;
    object-fit: cover;
}

.profile-left p {
    color: gray;
}

/* CENTER */
.profile-form {
    width: 75%;
    padding: 30px;
}

.form-group {
    margin-bottom: 12px;
}

.form-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 5px;
}

.row {
    display: flex;
    gap: 10px;
}

.row .form-group {
    flex: 1;
}

.btn {
    background: linear-gradient(135deg, #0d8bdc, #6a2c91);
    color: white;
    padding: 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
}

/* Upload hidden */
.upload-box {
    display: none;
    margin-top: 15px;
}
.readonly {
    background-color: #f1f1f1;
    cursor: not-allowed;
    color: #555;
}
.nav-avatar-fallback {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: white;
    color: #0d8bdc;
    font-size: 28px;
    font-weight: bold;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 auto 10px auto; /* center it */
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}


</style>

<script>
function showUpload() {
    document.getElementById("uploadBox").style.display = "block";
}
</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div class="app-container">
<!-- PROFILE (navbar left) -->


<!-- TOP NAVBAR -->


<div class="app-container">
    

    <!-- SIDEBAR -->
    <div class="sidebar">
       <div class="profile-header text-center mb-4">

    {% if current_user.profile_pic %}
        <img src="{{ current_user.profile_pic }}"
             class="rounded-circle mb-2"
             width="80"
             height="80">
    {% else %}
        <div class="nav-avatar-fallback">
            {{ current_user.name[0] | upper if current_user.name else "U" }}
        </div>
    {% endif %}


</div>
        <h3>Welcome, {{ current_user.name }}</h3>

        <ul>
            <li><a href="/home">Dashboard</a></li>
            <li><a href="/result">Results</a></li>
            <li><a href="/payment">Payments</a></li>
            <li><a href="/profile">Profile</a></li>
            <li><a href="/change-password">Change Password</a></li>
            <li><a href="/logout">Logout</a></li>
        </ul>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main">
        {% block content %}{% endblock %}
    </div>

</div>

</body>

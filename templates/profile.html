{% extends "base.html" %}
{% block content %}
<div class="main">

    <form method="POST" enctype="multipart/form-data" action="/profile">

        <div class="profile-card">

            <!-- LEFT SIDE -->
            <div class="profile-left">

                <label for="photoInput">

                    <img id="profilePic"
                         src="{% if current_user.photo %}
                                {{ url_for('static', filename='uploads/' + current_user.photo) }}
                             {% else %}
                                {{ url_for('static', filename='default.png') }}
                             {% endif %}">

                </label>

                <input type="file" name="photo" id="photoInput" style="display:none;">

                <!-- STATUS -->
                <p id="uploadStatus"
                   style="text-align:center; font-size:12px; color:green; display:none;">
                    ✔ Image selected (not saved yet)
                </p>

                <h3>{{ current_user.name }}</h3>
                <p>{{ current_user.email }}</p>

                <div class="form-group">
                    <label>Roll Number</label>
                    <input type="text" value="{{ current_user.sno }}" readonly class="readonly">
                </div>

            </div>

            <!-- RIGHT SIDE -->
            <div class="profile-form">

                <h2>Profile Settings</h2>

                <div class="row">
                    <div class="form-group">
                        <input type="text" name="fname" placeholder="First Name"
                               value="{{ current_user.name or '' }}">
                    </div>
                    <div class="form-group">
                        <input type="text" name="lname" placeholder="Surname">
                    </div>
                </div>

                <div class="form-group">
                    <input type="text" name="phone" placeholder="Mobile Number"
                           value="{{ current_user.phone or '' }}">
                </div>

                <div class="form-group">
                    <input type="text" name="addr1" placeholder="Address Line 1"
                           value="{{ current_user.address or '' }}">
                </div>

                <div class="form-group">
                    <input type="text" name="addr2" placeholder="Address Line 2">
                </div>

                <div class="form-group">
                    <input type="email" name="email"
                           value="{{ current_user.email or '' }}">
                </div>

                <div class="row">
                    <div class="form-group">
                        <input type="text" name="country" placeholder="Country"
                               value="{{ current_user.country or '' }}">
                    </div>
                    <div class="form-group">
                        <input type="text" name="region" placeholder="Region"
                               value="{{ current_user.region or '' }}">
                    </div>
                </div>

                <div class="form-group">
                    <label>Institution</label>
                    <input type="text" value="{{ current_user.institution }}" readonly class="readonly">
                </div>

                <button class="btn">Save Profile</button>

            </div>

        </div>

    </form>

</div>

<!-- SCRIPT -->
<script>
document.getElementById("photoInput").addEventListener("change", function (event) {

    const file = event.target.files[0];

    if (file) {

        document.getElementById("profilePic").src =
            URL.createObjectURL(file);

        document.getElementById("uploadStatus").style.display = "block";
    }
});
</script>

{% endblock %}

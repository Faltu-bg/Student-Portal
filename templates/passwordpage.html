<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Change Password</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f4f6fb;
}

/* Layout */
.container {
    display: flex;
    height: 100vh;
}

/* Sidebar */
.sidebar {
    width: 240px;
    background: linear-gradient(135deg, #0d8bdc, #6a2c91);
    color: white;
    padding: 30px 20px;
}

.sidebar h3 {
    text-align: center;
    margin-bottom: 30px;
}

.sidebar ul {
    list-style: none;
    padding: 0;
}

.sidebar ul li {
    margin: 20px 0;
}

.sidebar ul li a {
    color: white;
    text-decoration: none;
}

/* Main */
.main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Card */
.card {
    background: white;
    padding: 40px;
    border-radius: 10px;
    width: 400px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.card h2 {
    margin-bottom: 20px;
    text-align: center;
}

/* Form */
.form-group {
    margin-bottom: 15px;
}

input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 5px;
}

.btn {
    width: 100%;
    background: linear-gradient(135deg, #0d8bdc, #6a2c91);
    color: white;
    padding: 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <h3>{{ current_user.name }}</h3>
        <ul>
            <li><a href="/home">Dashboard</a></li>
            <li><a href="/result">Results</a></li>
            <li><a href="/payment">Payments</a></li>
            <li><a href="/profile">Settings</a></li>
            <li><a href="/change-password">Change Password</a></li>
            <li><a href="/logout">Logout</a></li>
        </ul>
    </div>

    <!-- Main -->
    <div class="main">

        <div class="card">
            <h2>Change Password</h2>

            <form method="POST">

                <div class="form-group">
                    <input type="password" name="old_password" placeholder="Current Password" required>
                </div>

                <div class="form-group">
                    <input type="password" name="new_password" placeholder="New Password" required>
                </div>

                <div class="form-group">
                    <input type="password" name="confirm_password" placeholder="Confirm New Password" required>
                </div>

                <button class="btn">Update Password</button>

            </form>

        </div>

    </div>

</div>

</body>
</html>

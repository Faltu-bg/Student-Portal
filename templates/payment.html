<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fee Status</title>

    <style>
        body { font-family: Arial; margin: 30px; }

        table {
            width: 60%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }

        th { background-color: #f2f2f2; }

        .paid {
            color: green;
            font-weight: bold;
        }

        .not-paid {
            color: red;
            font-weight: bold;
        }

        button {
            padding: 6px 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<h1>Semester Fee Status</h1>

<table>
    <tr>
        <th>Semester</th>
        <th>Status</th>
        <th>Action</th>
    </tr>

    {% for sem in range(1, 9) %}

    <tr>
        <td>Semester {{ sem }}</td>

        <!-- STATUS -->
        <td>
            {% if sem_status.get(sem) == "paid" %}
                <span class="paid">PAID ✅</span>
            {% else %}
                <span class="not-paid">NOT PAID ❌</span>
            {% endif %}
        </td>

        <!-- ACTION -->
        <td>
            {% if sem_status.get(sem) != "paid" %}

                <button onclick="payNow({{ sem }})">Pay Now </button>

            {% else %}
                <button disabled>Completed</button>
            {% endif %}
        </td>
    </tr>

    {% endfor %}

</table>

</body>
</html>

<script>
async function payNow(sem) {

    // Step 1: Call backend to create order
    const response = await fetch("/create_order", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ semester: sem })
    });
    if(!response.ok){
        alert("failed to create a order");
        return;
    }

    const data = await response.json();

    // Step 2: Configure Razorpay
    const options = {
        key: data.key,
        amount: data.amount,
        currency: "INR",
        order_id: data.order_id,

        name: "College Fees",
        description: "Semester " + sem + " Fees",
        prefill: {
        name: "Student Name",
        email: "student@email.com"
    },


        handler: function (response) {

            // Step 3: Send payment data to backend
            fetch("/verify_payment", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    ...response,
                    semester: sem
                })
            })

            
            .then(res => res.json())
            .then(data => {
                if (data.status === "Payment successful") {
                    alert("Payment successful!");
                    location.reload();
                } else {
                    alert("Verification failed!");
                }
            });
        },

        theme: {
            color: "#3399cc"
        }
    };

    // Step 4: Open Razorpay popup
    const rzp = new Razorpay(options);
    rzp.on('payment.failed',function(response){
        alert("Payment failed");
        console.log(response.error);
    });
    rzp.open();
}
</script>
